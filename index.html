<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="장기요양 길잡이">
    <title>장기요양급여 이용 안내</title>

    <link rel="manifest" href="manifest.webmanifest?v=20261019-install">
    <script src="app-install.js?v=20261019-share-v2"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261015">
    <link rel="stylesheet" href="fonts/pretendard-subset.css">
    <script src="assets/vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="documents.css">
    <link rel="stylesheet" href="design-common.css">
    <link rel="stylesheet" href="design-b.css">
    <link rel="stylesheet" href="design-b-home.css?v=20261019-install">
    <link rel="stylesheet" href="usage-process.css?v=20261019-process-v2">
    <link rel="stylesheet" href="guide-settings.css?v=20261015">
    <link rel="stylesheet" href="app-share.css?v=20261019-share-v2">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand hero-brand" href="#home" aria-label="처음 화면으로 이동">
                <span class="hero-copy">
                    <span class="hero-eyebrow"><img src="nhis-symbol.svg" alt="" width="20" height="20">국민건강보험공단</span>
                    <strong class="hero-title">장기요양급여 <em>이용 안내</em></strong>
                    <span class="hero-sub">수급자·보호자용 설명서</span>
                </span>
                <span class="hero-art" aria-hidden="true">
                    <img class="hero-art-book" src="icons3d/hero-book.webp" alt="" width="192" height="192">
                    <img class="hero-art-bulb" src="icons3d/hero-bulb.webp" alt="" width="192" height="192">
                </span>
            </a>
            <a class="header-search" href="#home?search" aria-label="검색하기"><i data-lucide="search" aria-hidden="true"></i><span>검색</span></a>
        </header>

        <div class="font-bar" role="group" aria-label="화면 보기 설정">
            <span class="font-bar-label">글씨 크기</span>
            <div class="font-controls">
                <button class="font-button" type="button" data-font="base" aria-pressed="false">보통</button>
                <button class="font-button" type="button" data-font="large" aria-pressed="true">크게</button>
                <button class="font-button" type="button" data-font="xlarge" aria-pressed="false">아주 크게</button>
            </div>
            <button id="fullscreenToggle" class="fullscreen-toggle" type="button" aria-label="전체화면으로 보기" aria-pressed="false" title="전체화면으로 보기">
                <i data-lucide="maximize-2" aria-hidden="true"></i>
                <span class="sr-only">전체화면</span>
            </button>
        </div>

        <div class="search-band">
            <form class="search-panel" id="guideSearch" role="search" aria-label="안내 내용 검색">
                <i data-lucide="search" aria-hidden="true"></i>
                <div class="search-field">
                    <label class="search-box">
                        <span class="sr-only">안내 내용 검색</span>
                        <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="궁금한 내용을 검색하세요">
                    </label>
                    <button class="search-submit" type="submit" aria-label="검색" title="검색"><i data-lucide="arrow-right" aria-hidden="true"></i></button>
                </div>
            </form>
        </div>

        <main id="app" tabindex="-1"></main>

        <nav class="bottom-nav" aria-label="주요 화면">
            <a href="#home" class="nav-link" data-route="home">
                <span class="nav-icon"><i data-lucide="house" aria-hidden="true"></i></span>
                <span>홈</span>
            </a>
            <a href="#contents" class="nav-link" data-route="contents">
                <span class="nav-icon"><i data-lucide="list" aria-hidden="true"></i></span>
                <span>목차</span>
            </a>
            <a href="#book" class="nav-link" data-route="book">
                <span class="nav-icon"><i data-lucide="book-open" aria-hidden="true"></i></span>
                <span>이북</span>
            </a>
            <a href="#settings" class="nav-link" data-route="settings">
                <span class="nav-icon"><i data-lucide="message-square-text" aria-hidden="true"></i></span>
                <span>고객의 소리</span>
            </a>
        </nav>
    </div>

    <script src="content-data.js?v=20261019-process-v2"></script>
    <script>if (!location.hash) location.hash = '#home';</script>
    <script src="reviewed-content.js?v=20261015"></script>
    <script src="search-aliases.js"></script>
    <script src="app-config.js?v=20261015-2"></script>
    <script src="app.js?v=20261019-install"></script>
    <script src="traffic.js?v=20261016"></script>
</body>
</html>
