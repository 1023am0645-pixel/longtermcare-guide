<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>장기요양급여 이용 안내</title>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="#home" aria-label="처음 화면으로 이동">
                <span class="brand-mark" aria-hidden="true">
                    <i data-lucide="clipboard-list"></i>
                </span>
                <span>
                    <strong>장기요양급여 이용 안내</strong>
                </span>
            </a>

            <div class="font-controls" aria-label="글씨 크기 조절">
                <button class="font-button" type="button" data-font="base">가</button>
                <button class="font-button" type="button" data-font="large">크게</button>
                <button class="font-button" type="button" data-font="xlarge">아주 크게</button>
            </div>
        </header>

        <div class="search-band">
            <label class="search-box">
                <i data-lucide="search" aria-hidden="true"></i>
                <span class="sr-only">안내 내용 검색</span>
                <input id="searchInput" type="search" autocomplete="off" placeholder="서비스명, 본인부담금, 방문요양 검색">
            </label>
        </div>

        <main id="app" tabindex="-1"></main>

        <nav class="bottom-nav" aria-label="주요 화면">
            <a href="#home" class="nav-link" data-route="home">
                <i data-lucide="home" aria-hidden="true"></i>
                <span>가이드</span>
            </a>
            <a href="#contents" class="nav-link" data-route="contents">
                <i data-lucide="list" aria-hidden="true"></i>
                <span>목차</span>
            </a>
            <a href="#book" class="nav-link" data-route="book">
                <i data-lucide="book-open" aria-hidden="true"></i>
                <span>이북</span>
            </a>
        </nav>
    </div>

    <script src="js/app.js?v=32"></script>
</body>
</html>
